services:
  - type: web
    name: r-ams-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && node node_modules/prisma/build/index.js generate && node node_modules/prisma/build/index.js migrate deploy
    startCommand: npm start
    healthCheckPath: /api/stats
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: file:/opt/render/project/data/dev.db
      - key: FRONTEND_URL
        sync: false   # Set this manually in Render dashboard to your Vercel URL
      - key: SMTP_HOST
        value: smtp.ethereal.email
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: SMTP_FROM
        value: r-ams@railways.gov.in
    disk:
      name: ramsdata
      mountPath: /opt/render/project/data
      sizeGB: 1
